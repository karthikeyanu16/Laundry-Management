<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshPress - Redirecting...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
    }
    .card {
      background: #ffffff;
      padding: 36px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 440px;
      margin: 20px;
      border: 1px solid #e2e8f0;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: #0284c7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { margin: 0 0 10px; font-size: 1.35rem; }
    p { margin: 0 0 20px; color: #64748b; font-size: 0.95rem; }
    .btn {
      display: inline-block;
      background: #0284c7;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .btn:hover { background: #0369a1; }
  </style>

  <script>
    (function () {
      // 1. Detect if we are already inside the "pages" directory or at the root
      const pathname = window.location.pathname;
      const isInPagesFolder = pathname.includes('/pages/');

      // 2. Select target based on actual folder
      const targetUrl = isInPagesFolder ? "services.html" : "pages/index.html";

      // 3. Prevent infinite loops: check if already redirected in this session
      const redirected = sessionStorage.getItem("freshpress_redirected");

      if (!redirected && !pathname.endsWith(targetUrl)) {
        sessionStorage.setItem("freshpress_redirected", "true");
        window.location.replace(targetUrl);
      } else {
        sessionStorage.removeItem("freshpress_redirected");
      }
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>FreshPress Laundry & Dry-Cleaning</h2>
    <p>Opening the landing page...</p>
    <a id="redirect-link" href="pages/index.html" class="btn">Click Here to Enter</a>
  </div>

  <script>
    // Update button link dynamically if inside pages directory
    if (window.location.pathname.includes('/pages/')) {
      document.getElementById('redirect-link').setAttribute('href', 'services.html');
    }
  </script>
</body>
</html>
